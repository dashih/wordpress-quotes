services:
  wordpress:
    # user: test
    # password: test
    image: wordpress:6.8.3
    container_name: wordpress_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: dumbledore
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_dev_web:/var/www/html

  quotes:
    image: registry.internal.dannyshih.net:5000/wordpress-quotes:v1.3.0
    container_name: wordpress_quotes
    platform: linux/amd64
    build: .
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: dumbledore
      WORDPRESS_DB_NAME: wordpress

  db:
    image: mariadb:10.5.16
    container_name: wordpress_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: dumbledore
      MARIADB_DATABASE: wordpress
    volumes:
      - wordpress_dev_db:/var/lib/mysql


  phpMyAdmin:
    image: phpmyadmin:5.2.0
    container_name: wordpress_phpMyAdmin
    restart: unless-stopped
    ports:
      - "8002:80"
    environment:
      PMA_HOST: db

volumes:
  wordpress_dev_web:
  wordpress_dev_db:
